name: Deploy Asia Stock Market Research to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate synthetic demo data
        run: python pipeline/build_web_data.py
      - name: Scan monitored research feeds
        env:
          RESEARCH_UPDATES_PATH: src/lib/content/research-updates.json
        run: python pipeline/scan_research_updates.py
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/
      - name: Persist research update history
        run: |
          if git diff --quiet -- src/lib/content/research-updates.json; then
            echo "Research update history is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/content/research-updates.json
            git commit -m "Update research publication tracker"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5