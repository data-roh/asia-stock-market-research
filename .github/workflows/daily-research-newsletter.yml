name: Daily Research Newsletter

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-research-newsletter
  cancel-in-progress: false

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install research radar browser
        run: |
          python -m pip install -r requirements-radar.txt
          python -m playwright install --with-deps chromium
      - name: Restore private scan state
        uses: actions/cache/restore@v4
        with:
          path: .state/research-updates.json
          key: research-updates-${{ github.run_id }}
          restore-keys: research-updates-
      - name: Restore radar email state
        uses: actions/cache/restore@v4
        with:
          path: .state/research-radar-email.json
          key: research-radar-email-${{ github.run_id }}
          restore-keys: research-radar-email-
      - name: Scan public research sources
        id: scan
        env:
          RESEARCH_UPDATES_PATH: .state/research-updates.json
        run: python pipeline/scan_research_updates.py
      - name: Verify Phase 1 research candidates
        id: verify
        if: steps.scan.outcome == 'success'
        env:
          RESEARCH_UPDATES_PATH: .state/research-updates.json
        run: python pipeline/verify_research_updates.py
      - name: Build and send email digest
        env:
          RESEARCH_UPDATES_PATH: .state/research-updates.json
          NEWSLETTER_PREVIEW_PATH: ${{ runner.temp }}/newsletter-preview.html
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
        run: python pipeline/send_research_newsletter.py
      - name: Save private scan state
        if: always() && steps.scan.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .state/research-updates.json
          key: research-updates-${{ github.run_id }}
      - name: Build public research radar
        id: radar
        if: always() && steps.scan.outcome == 'success'
        env:
          RESEARCH_UPDATES_PATH: .state/research-updates.json
          GITHUB_TOKEN: ${{ github.token }}
        run: python pipeline/build_research_radar.py
      - name: Generate or send daily radar digest
        id: digest
        if: always() && steps.radar.outcome == 'success'
        env:
          EMAIL_DRY_RUN: ${{ vars.RESEARCH_RADAR_EMAIL_DRY_RUN || 'true' }}
          SEND_EMPTY_DIGEST: 'false'
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RESEARCH_RADAR_EMAIL_STATE: .state/research-radar-email.json
          RESEARCH_RADAR_EMAIL_PREVIEW: ${{ runner.temp }}/research-radar-email
        run: python pipeline/send_research_radar_digest.py
      - name: Save radar email state
        if: always() && steps.digest.outcome == 'success' && vars.RESEARCH_RADAR_EMAIL_DRY_RUN == 'false'
        uses: actions/cache/save@v4
        with:
          path: .state/research-radar-email.json
          key: research-radar-email-${{ github.run_id }}
      - name: Publish radar data
        id: publish
        if: always() && steps.radar.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content/research-radar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update research radar"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed Pages site
        if: always() && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Send weekly radar on Hong Kong Monday
        if: always() && steps.radar.outcome == 'success'
        env:
          WEEKLY_PREVIEW_PATH: ${{ runner.temp }}/weekly-radar-preview.html
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
        run: python pipeline/send_weekly_radar.py
      - name: Upload private newsletter preview
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: newsletter-preview
          path: ${{ runner.temp }}/newsletter-preview.html
          if-no-files-found: ignore
      - name: Upload weekly radar preview
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: weekly-radar-preview
          path: ${{ runner.temp }}/weekly-radar-preview.html
          if-no-files-found: ignore
      - name: Upload daily radar digest preview
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: research-radar-daily-digest
          path: ${{ runner.temp }}/research-radar-email/
          if-no-files-found: ignore
